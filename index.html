<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ComicCraft - Turn your doodles into comics</title>
<meta name="description" content="Create, read and share comics. Draw or scan a sketch, add speech bubbles and stickers, and share with the community.">
<meta name="theme-color" content="#0F101A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.jpg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&family=Baloo+Da+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F101A;--surf:#181A2A;--card:#22243A;--line:#333754;--tx:#F4F5FB;--mut:#A9ACC6;
  --indigo:#6C5CE7;--indL:#A29BFE;--orange:#FF5722;--cyan:#00CEC9;--yellow:#FDCB6E;--pink:#FD79A8;
  --edge:#05050B;--paper:#FFFDF6;--ink:#16172A;--focus:#FDCB6E;--dots:rgba(162,155,254,.11);
  --disp:Bangers,Impact,"Arial Narrow",sans-serif;
  --body:"Baloo 2","Baloo Da 2","Trebuchet MS",system-ui,sans-serif;
}
[data-theme=light]{--bg:#F8F9FD;--surf:#FFFFFF;--card:#EFF2F8;--line:#D3D8EA;--tx:#16172A;--mut:#585C7A;--edge:#16172A;--focus:#6C5CE7;--dots:rgba(108,92,231,.10)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:600 1.05rem/1.45 var(--body);color:var(--tx);background:var(--bg);background-image:radial-gradient(var(--dots) 1.6px,transparent 1.8px);background-size:18px 18px;padding-bottom:84px;min-height:100vh}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.04em;margin:0;line-height:1}
h2{font-size:clamp(1.9rem,5vw,2.8rem)}
p{margin:0}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sec{padding:34px 0 8px}
.muted{color:var(--mut)}

/* header & nav */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:400 1.8rem/1 var(--disp);letter-spacing:.05em}
.brand img{width:40px;height:40px;border-radius:11px;border:3px solid var(--edge)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;padding:8px 13px;border-radius:12px;min-height:44px;font-weight:800}
.nav a[aria-current=page]{background:var(--indigo);color:#fff}
.nav a:not([aria-current=page]):hover{background:var(--card)}
.ctl{display:flex;gap:8px}
.ico{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx);font:800 1rem var(--body);cursor:pointer}
.ico:hover{border-color:var(--indL)}
#navB{display:none}
@media(max-width:860px){
  #navT{display:none}
  #navB{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--surf);border-top:3px solid var(--edge)}
  #navB a{flex-direction:column;gap:0;padding:5px 0;font-size:.78rem;line-height:1.15;justify-content:center;text-align:center;min-height:54px}
  #navB a b{font-size:1.4rem;font-weight:400}
  .ctl{margin-left:auto}
}

/* buttons, fields */
.btn{font:800 1.05rem/1 var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:3px solid var(--edge);border-radius:14px;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--edge);text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--edge)}
.btn.pri{background:var(--orange)}
.btn.cy{background:var(--cyan)}
.btn.pk{background:var(--pink)}
.btn.ghost{background:var(--card);color:var(--tx);box-shadow:0 5px 0 var(--line);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.sm{min-height:44px;padding:6px 12px;font-size:1rem}
.chip{font:800 1rem/1 var(--body);min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
.chip.on{background:var(--indigo);border-color:var(--indL);color:#fff}
.field{font:700 1.1rem var(--body);width:100%;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx)}
textarea.field{resize:vertical;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.rowf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:.95rem;margin:0 6px 8px 0}

/* hero + promo */
.hero{position:relative;color:#fff;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 92%,0 100%);background:#0b0b16}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(11,11,22,.94) 0%,rgba(11,11,22,.62) 48%,rgba(11,11,22,.08) 100%)}
.hero .wrap{position:relative;z-index:2;padding-top:48px;padding-bottom:100px}
.cap{display:inline-block;background:var(--yellow);color:var(--ink);border:3px solid #000;padding:4px 14px;border-radius:4px;transform:rotate(-1.5deg);font-weight:800;box-shadow:4px 4px 0 #000}
.hero h1{font-size:clamp(3rem,10vw,6.6rem);margin:16px 0 12px;max-width:9.5em;transform:rotate(-1.5deg);text-shadow:4px 4px 0 var(--indigo),8px 8px 0 #000;letter-spacing:.03em}
.hero p{max-width:30em;font-size:1.2rem;color:#e9eaf7;margin-bottom:22px}
.hero .row{display:flex;gap:14px;flex-wrap:wrap}
@media(max-width:760px){.hero::before{background:linear-gradient(180deg,rgba(11,11,22,.55),rgba(11,11,22,.92))}.hero .wrap{padding-top:34px}}
.promo{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:-34px;position:relative;z-index:3;background:linear-gradient(120deg,var(--indigo),var(--pink));color:#fff;border:4px solid #000;box-shadow:7px 7px 0 #000;padding:18px 22px;transform:rotate(-.6deg)}
.promo .big{font-size:3rem;line-height:1}
.promo h3{font-size:2rem;margin-bottom:2px}
.promo p{opacity:.95}
.promo .btn{margin-left:auto}
@media(max-width:700px){.promo .btn{margin-left:0;width:100%}}

/* comic cards */
.shelf{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:20px}
.cc{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:7px 7px 0 var(--c,var(--indigo));transform:rotate(var(--rot,0deg));transition:transform .18s,box-shadow .18s;font-family:var(--body);font-weight:600}
.cc:hover,.cc:focus-visible{transform:rotate(0) translateY(-6px);box-shadow:11px 11px 0 var(--c,var(--indigo))}
.cc .cv{aspect-ratio:4/3;border-bottom:4px solid #000;overflow:hidden;position:relative;background:#222}
.cc .cv svg,.cc .cv img{width:100%;height:100%;display:block;object-fit:cover}
.cc .tag{position:absolute;left:8px;top:8px;background:var(--yellow);color:var(--ink);border:2px solid #000;padding:0 10px;font-weight:800;font-size:.9rem;border-radius:4px;transform:rotate(-2deg)}
.cc .in{padding:12px 14px 14px}
.cc h3{font-size:1.55rem;line-height:1.05;margin-bottom:4px}
.cc .meta{display:flex;justify-content:space-between;color:#4a4c68;font-size:.95rem;gap:8px}
.bar{height:8px;background:#ddd;border-radius:6px;overflow:hidden;margin-top:8px;border:2px solid #000}
.bar i{display:block;height:100%;background:var(--cyan)}
.sh-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.foot{margin:56px 0 20px;text-align:center;color:var(--mut)}
.empty{text-align:center;padding:44px 10px;color:var(--mut);grid-column:1/-1}
.empty .big{font-size:3.6rem}

/* reader */
.back{margin:20px 0 6px}
.rhead{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:26px;align-items:start;margin:14px 0 28px}
@media(max-width:760px){.rhead{grid-template-columns:1fr}}
.rhead .cv{border:4px solid #000;box-shadow:8px 8px 0 var(--indigo);aspect-ratio:4/3;overflow:hidden;background:#222}
.rhead .cv svg,.rhead .cv img{width:100%;height:100%;object-fit:cover;display:block}
.rhead h2{font-size:clamp(2.2rem,6vw,3.6rem);margin-bottom:8px}
.stars{display:flex;gap:2px;margin:6px 0 8px}
.stars button{background:none;border:0;font-size:2.1rem;line-height:1;min-width:46px;min-height:46px;cursor:pointer;filter:grayscale(1) opacity(.45)}
.stars button.on{filter:none}
.strip{max-width:560px;margin:0 auto;display:grid;gap:26px}
.rp{position:relative;aspect-ratio:1;border:4px solid #000;background:#222;overflow:hidden;box-shadow:7px 7px 0 var(--indigo);opacity:0;transform:translateY(24px) rotate(var(--rr,0deg));transition:opacity .5s,transform .5s}
.rp.in{opacity:1;transform:none}
.rp svg,.rp canvas{position:absolute;inset:0;width:100%;height:100%}
.rp[data-s="1"] svg{filter:saturate(1.45) contrast(1.1)}
.rp[data-s="2"] svg{filter:hue-rotate(-20deg) saturate(1.4) contrast(1.2) brightness(.82)}
.rp[data-s="3"] svg{filter:sepia(.6) grayscale(.15) contrast(1.05)}
.rp[data-s="4"] svg{filter:grayscale(1) contrast(1.35)}
.scene text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.endcard{max-width:560px;margin:30px auto;text-align:center;background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:7px 7px 0 var(--orange);padding:22px}
.endcard h3{font-size:2rem;margin-bottom:6px}
.prog{position:fixed;left:0;top:0;height:6px;background:var(--cyan);z-index:50;width:0;transition:width .1s}
.cmts{max-width:560px;margin:34px auto 0;display:grid;gap:12px}
.cmt{display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.cmt .av{font-size:1.8rem;line-height:1}
.cmt b{display:block}

/* studio */
.picker{padding-top:18px}
.lcards{display:grid;gap:26px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:20px}
.lc{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:7px 7px 0 var(--c,var(--indigo));padding:16px;font-family:var(--body);font-weight:600;transition:transform .15s,box-shadow .15s}
.lc:hover,.lc:focus-visible{transform:translateY(-5px);box-shadow:10px 10px 0 var(--c,var(--indigo))}
.lc .mini{display:grid;gap:5px;background:#000;padding:5px;width:150px;margin:0 auto 14px}
.lc .mini b{background:#fff;display:block}
.lc h3{font-size:1.6rem;margin:6px 0 2px}
.lc .sub{color:#4a4c68}
.lc .d{margin-top:8px;font-size:.95rem;color:#3a3c58}
.lc .pill{background:var(--yellow);color:var(--ink);border-color:#000;margin:0}
.studio{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 380px;padding-top:16px;align-items:start}
@media(max-width:980px){.studio{grid-template-columns:1fr}}
.stage-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.stage-top .field{flex:1 1 200px;min-width:0}
.tour{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:3px dashed var(--indL);border-radius:16px;padding:8px 12px;margin-bottom:12px}
.tour span{font-weight:800}
.tour .x{margin-left:auto}
.board{display:grid;gap:10px;background:#000;padding:10px;margin:0 auto;border:4px solid #000;box-shadow:8px 8px 0 var(--orange)}
.sp{position:relative;background:#fff;overflow:hidden;cursor:crosshair}
.sp.act{outline:6px solid var(--yellow);outline-offset:-6px}
.sp canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.plabel{position:absolute;left:8px;top:8px;background:var(--yellow);color:var(--ink);border:2px solid #000;font-weight:800;font-size:.85rem;padding:0 8px;border-radius:4px;pointer-events:none;opacity:.9}
.board[data-style="1"] .dr{filter:saturate(1.45) contrast(1.1)}
.board[data-style="2"] .dr{filter:hue-rotate(-20deg) saturate(1.4) contrast(1.2) brightness(.82)}
.board[data-style="3"] .dr{filter:sepia(.6) grayscale(.15) contrast(1.05)}
.board[data-style="4"] .dr{filter:grayscale(1) contrast(1.35)}
@media(prefers-reduced-motion:no-preference){
  .board[data-motion="1"] .dr{animation:pan 7s ease-in-out infinite alternate}
  .board[data-motion="2"] .dr{animation:shake .35s linear infinite}
  .board[data-motion="3"] .dr{animation:breath 3.2s ease-in-out infinite alternate}
  @keyframes pan{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-2.5%,-2%)}}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.2%,.8%)}50%{transform:translate(1%,-1%)}75%{transform:translate(-.6%,-.8%)}}
  @keyframes breath{from{transform:scale(1)}to{transform:scale(1.045)}}
}
.hint{margin:14px 0 8px;color:var(--mut);text-align:center}
.selbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;background:var(--card);border:3px solid var(--yellow);border-radius:16px;padding:8px 10px;margin:10px auto;max-width:640px}
.selbar span{font-weight:800;margin-right:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.dock{background:var(--surf);border:3px solid var(--line);border-radius:20px;padding:12px;position:sticky;top:78px;max-height:calc(100vh - 92px);overflow:auto}
@media(max-width:980px){.dock{position:static;max-height:none}}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{display:flex;flex-direction:column;align-items:center;font:800 .9rem/1.2 var(--body);padding:8px 2px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--tx);cursor:pointer;min-height:60px}
.tabs button b{font-size:1.45rem;font-weight:400;line-height:1.2}
.tabs button[aria-selected=true]{background:var(--indigo);color:#fff;border-color:var(--indL)}
.pane{display:grid;gap:12px}
.pane h3{font-size:1.25rem;color:var(--indL)}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--edge);cursor:pointer;padding:0;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 4px var(--yellow)}
.cust{position:relative;width:44px;height:44px;border-radius:50%;border:3px dashed var(--mut);display:grid;place-items:center;cursor:pointer;font-size:1.3rem;overflow:hidden}
.cust input{position:absolute;inset:-10px;opacity:0;cursor:pointer;width:80px;height:80px}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;height:36px;accent-color:var(--pink)}
.rng i{width:44px;height:44px;display:grid;place-items:center}
.rng i u{display:block;border-radius:50%;background:var(--tx)}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stk button{font-size:2rem;line-height:1;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.stk button:hover{border-color:var(--yellow);transform:scale(1.06)}

/* community */
.feed{display:grid;gap:30px;max-width:640px;margin:22px auto 0}
.post{background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:7px 7px 0 var(--c,var(--indigo))}
.post .ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ava{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:3px solid #000;font-size:1.4rem;background:var(--yellow)}
.post .fi{aspect-ratio:4/3;border-top:4px solid #000;border-bottom:4px solid #000;background:#222;overflow:hidden;display:grid}
.post .fi svg,.post .fi img{width:100%;height:100%;object-fit:contain;display:block;background:#111}
.post .pb{padding:12px 14px 14px}
.post h3{font-size:1.5rem;margin-bottom:4px}
.post .design{margin-top:8px;font-size:.92rem;color:#4a4c68}
.post .pa{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hdr{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}

/* collab */
.rooms{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:20px}
.room{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:7px 7px 0 var(--c,var(--cyan));padding:16px;font-family:var(--body);font-weight:600}
.room:hover,.room:focus-visible{transform:translateY(-4px)}
.room h3{font-size:1.6rem;margin-bottom:4px}
.room p{color:#3a3c58;font-size:.98rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.st{display:inline-block;border:2px solid #000;border-radius:999px;padding:0 10px;font-weight:800;font-size:.85rem;background:var(--cyan);color:var(--ink)}
.st.done{background:var(--yellow)}
.script{min-height:260px;font-size:1.1rem}
.mem{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}

/* profile */
.pf{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--surf);border:3px solid var(--line);border-radius:22px;padding:18px;margin-top:20px}
.pf .big{font-size:4rem;line-height:1;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--yellow);border:4px solid var(--edge)}
.pf .fld{flex:1 1 240px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:16px;text-align:center;padding:10px}
.stats b{display:block;font:400 2.2rem/1 var(--disp);color:var(--yellow)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.note{background:var(--card);border-left:6px solid var(--cyan);border-radius:10px;padding:10px 14px;margin:12px 0;color:var(--mut)}

/* dialog + toast */
dialog{border:4px solid #000;border-radius:18px;background:var(--paper);color:var(--ink);padding:22px;width:min(92vw,440px);box-shadow:8px 8px 0 var(--indigo)}
dialog::backdrop{background:rgba(5,5,11,.65)}
dialog h3{font-size:1.8rem;margin-bottom:12px}
dialog .field{background:#fff;color:var(--ink);border-color:#9aa0c0;margin-bottom:10px}
dialog menu{display:flex;flex-direction:row-reverse;gap:10px;justify-content:flex-start;padding:0;margin:14px 0 0}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,30px);background:var(--yellow);color:var(--ink);border:3px solid #000;border-radius:14px;padding:10px 18px;font-weight:800;box-shadow:0 5px 0 #000;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:861px){#toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rp{opacity:1;transform:none}}

/* published comics, select, reports, AI */
.strip.wide{max-width:720px}
.rp.pg{aspect-ratio:auto;background:#fff}
.rp.pg img{position:static;display:block;width:100%;height:auto}
select.field{appearance:auto}
.rep{min-width:44px}
#aiBox{border:3px dashed var(--pink);border-radius:16px;padding:10px;display:grid;gap:12px}
#aiBox[hidden]{display:none}
#aiBox h3{font-size:1.25rem;color:var(--pink)}

</style>
</head>
<body>
<noscript><p style="padding:24px">ComicCraft needs JavaScript to run. Please turn it on in your browser.</p></noscript>
<div class="prog" id="prog" hidden></div>

<header class="top"><div class="wrap">
  <a class="brand" href="#home"><img src="assets/icon.jpg" alt="">ComicCraft</a>
  <nav class="nav" id="navT" aria-label="Main"></nav>
  <div class="ctl">

const dlg=$('#dlg');
function ask({title,text,fields=[],confirm,okText}){
  return new Promise(res=>{
    $('#dlgT').textContent=title;const box=$('#dlgF');box.innerHTML='';
    if(text){const p=document.createElement('p');p.textContent=text;p.style.margin='0 0 12px';box.append(p)}
    const els=fields.map(f=>{let e;if(f.select){e=document.createElement('select');f.select.forEach(o=>{const op=document.createElement('option');op.value=o.v;op.textContent=o.l;e.append(op)});e.value=f.value!=null?f.value:f.select[0].v}else{e=document.createElement(f.area?'textarea':'input');e.maxLength=f.max||120;e.placeholder=f.ph||'';e.value=f.value||'';if(f.area)e.rows=4}e.className='field';e.setAttribute('aria-label',f.ph||title);box.append(e);return e});
    $('#dlgOk').textContent=okText||(confirm?t('ok_yes'):t('dlg_ok'));$('#dlgNo').textContent=t('dlg_cancel');
    const done=()=>{dlg.removeEventListener('close',done);if(dlg.returnValue!=='ok')return res(null);res(confirm?true:els.map(e=>e.value.trim()))};
    dlg.addEventListener('close',done);dlg.showModal();if(els[0]){els[0].focus();if(els[0].select)els[0].select()}
  });
}
const ask1=async(title,value)=>{const r=await ask({title,fields:[{value}]});return r&&r[0]?r[0]:null};

/* database: local (always) + optional cloud (Firebase) for the shared collections */
function makeLocal(){
  const subs={},rd=c=>LS.get('cc_db_'+c,[]),emit=c=>(subs[c]||[]).forEach(f=>f(rd(c)));
  addEventListener('storage',e=>{if(e.key&&e.key.indexOf('cc_db_')===0)emit(e.key.slice(6))});
  return{mode:'local',user:null,
    sub(c,f){(subs[c]=subs[c]||[]).push(f);f(rd(c));return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==f)}},
    put(c,doc){const l=rd(c),i=l.findIndex(d=>d.id===doc.id);if(i>=0)l[i]=doc;else l.unshift(doc);const ok=LS.set('cc_db_'+c,l);emit(c);return Promise.resolve(ok)},
    del(c,id){LS.set('cc_db_'+c,rd(c).filter(d=>d.id!==id));emit(c);return Promise.resolve(true)},
    inc(c,id,f,d){const l=rd(c),x=l.find(o=>o.id===id);if(x){x[f]=Math.max(0,(x[f]||0)+d);LS.set('cc_db_'+c,l);emit(c)}return Promise.resolve(!!x)},
    get:(c,id)=>rd(c).find(d=>d.id===id)};
}
const LOCAL=makeLocal();
let DB=makeLocal();
const unsubs={};
function subscribe(key,db,col,fn){if(unsubs[key])unsubs[key]();unsubs[key]=db.sub(col,fn)}

async function enableFirebase(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,F,AU]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
  const app=A.initializeApp(cfg),fs=cfg.firestoreDatabaseId?F.getFirestore(app,cfg.firestoreDatabaseId):F.getFirestore(app),auth=AU.getAuth(app);
  const cache={},api={mode:'firebase',user:null};
  api.sub=(c,f)=>F.onSnapshot(F.query(F.collection(fs,c),F.orderBy('updatedAt','desc'),F.limit(60)),s=>{cache[c]=s.docs.map(d=>({...d.data(),id:d.id}));f(cache[c])},e=>console.warn('Firestore',e.code));
  api.put=async(c,doc)=>{try{const {id,...rest}=doc;await F.setDoc(F.doc(fs,c,id),rest);return true}catch(e){console.warn(e);return false}};
  api.del=async(c,id)=>{try{await F.deleteDoc(F.doc(fs,c,id));return true}catch(e){return false}};
  api.get=(c,id)=>(cache[c]||[]).find(d=>d.id===id);
  api.inc=async(c,id,f,d)=>{try{await F.updateDoc(F.doc(fs,c,id),{[f]:F.increment(d)});return true}catch(e){console.warn(e);return false}};
  api.signIn=()=>AU.signInWithPopup(auth,new AU.GoogleAuthProvider());
  api.signOut=()=>AU.signOut(auth);
  AU.onAuthStateChanged(auth,u=>{api.user=u;if(typeof onAuthChange==='function')onAuthChange()});
  DB=api;
  if(typeof startShared==='function')startShared();
  if(typeof onAuthChange==='function')onAuthChange();
}

function wrapText(c,txt,max){const out=[];let l='';txt.split(/\s+/).forEach(w=>{const n=l?l+' '+w:w;if(c.measureText(n).width>max&&l){out.push(l);l=w}else l=n});if(l)out.push(l);return out.length?out:['']}

/* one drawing routine for studio, reader and export */
function drawItem(c,it,W,H,sel,exp){
  const k=W/400,sc=(it.s||1)*(exp||it.pop==null?1:it.pop);
  c.save();c.translate(it.x*W,it.y*H);c.rotate((it.r||0)*Math.PI/180);c.scale(sc,sc);
  c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineCap='round';
  let w=0,h=0;
  if(it.t==='sticker'){

function stylize(x,ox,oy,w,h,s){
  if(!s)return;const d=x.getImageData(ox,oy,w,h),a=d.data;
  for(let i=0;i<a.length;i+=4){let r=a[i],g=a[i+1],b=a[i+2];const l=.299*r+.587*g+.114*b;
    if(s===1){r=l+(r-l)*1.45;g=l+(g-l)*1.45;b=l+(b-l)*1.45;r=(r-128)*1.1+128;g=(g-128)*1.1+128;b=(b-128)*1.1+128}
    else if(s===2){r=l+(r-l)*1.4;g=l+(g-l)*1.4;b=l+(b-l)*1.4;r*=.7;g*=.8;b*=1.0;r=(r-128)*1.2+128;g=(g-128)*1.2+128;b=(b-128)*1.2+128}
    else if(s===3){const tr=.393*r+.769*g+.189*b,tg=.349*r+.686*g+.168*b,tb=.272*r+.534*g+.131*b;r=r*.4+tr*.6;g=g*.4+tg*.6;b=b*.4+tb*.6;r=(r-128)*1.05+128;g=(g-128)*1.05+128;b=(b-128)*1.05+128}
    else{r=g=b=(l-128)*1.35+128}

}

/* panels */
function mkPanel(i,h){
  const el=document.createElement('div');el.className='sp';el.style.aspectRatio=`${S}/${h}`;
  const dr=document.createElement('canvas'),fx=document.createElement('canvas');
  dr.width=fx.width=S;dr.height=fx.height=h;dr.className='dr';fx.className='fx';
  const lab=document.createElement('span');lab.className='plabel';lab.textContent=st.lay.labels[i];
  el.append(dr,fx,lab);
  const dctx=dr.getContext('2d',{willReadFrequently:true});dctx.fillStyle='#fff';dctx.fillRect(0,0,S,h);
  const p={i,W:S,H:h,el,dr,dctx,fx,fctx:fx.getContext('2d'),hist:[],redo:[],items:[]};wire(p);return p;
}
function buildBoard(){
  const L=st.lay,b=$('#board');b.innerHTML='';st.panels=[];st.sel=null;st.act=0;
  b.style.gridTemplateColumns=`repeat(${L.cols},1fr)`;b.style.maxWidth=L.mw+'px';
  L.h.forEach((h,i)=>{const p=mkPanel(i,h);b.append(p.el);st.panels.push(p)});
  refresh();
}
function renderFx(p){p.fctx.clearRect(0,0,p.W,p.H);p.items.forEach(it=>drawItem(p.fctx,it,p.W,p.H,st.sel&&st.sel.it===it))}
function redrawAll(){st.panels.forEach(renderFx);if(typeof paintReader==='function')paintReader()}
function refresh(){
  st.panels.forEach((p,i)=>{p.el.classList.toggle('act',i===st.act&&st.panels.length>1);renderFx(p)});
  const p=P();$('#undo').disabled=!p||!p.hist.length;$('#redo').disabled=!p||!p.redo.length;
  const s=st.sel;$('#selbar').hidden=!s;if(s)$('#sEdit').hidden=s.it.t==='sticker';
}
function setSel(p,it){const old=st.sel;st.sel=it?{p,it}:null;if(old&&old.p!==p)renderFx(old.p);if(p)renderFx(p);refresh()}
const cur=p=>({img:p.dctx.getImageData(0,0,p.W,p.H),items:ser(p.items)});
function snap(p){p.hist.push(cur(p));if(p.hist.length>12)p.hist.shift();p.redo=[]}
function apply(p,s){p.dctx.putImageData(s.img,0,0);p.items=JSON.parse(s.items);if(st.sel&&st.sel.p===p)st.sel=null;refresh()}
function undo(){const p=P(),s=p&&p.hist.pop();if(!s)return;p.redo.push(cur(p));apply(p,s)}
function redo(){const p=P(),s=p&&p.redo.pop();if(!s)return;p.hist.push(cur(p));apply(p,s)}

function wire(p){
  const fx=p.fx;let mode=null,last,off,snapped=false;
  const pos=e=>{const r=fx.getBoundingClientRect();return{x:(e.clientX-r.left)*p.W/r.width,y:(e.clientY-r.top)*p.H/r.height}};
  fx.addEventListener('pointerdown',e=>{
    e.preventDefault();fx.setPointerCapture(e.pointerId);st.act=p.i;const q=pos(e);
    const hit=[...p.items].reverse().find(it=>it.bb&&Math.abs(q.x-it.bb.x)<=it.bb.w/2+12&&Math.abs(q.y-it.bb.y)<=it.bb.h/2+12);
    if(hit){setSel(p,hit);mode='move';snapped=false;off={x:hit.x*p.W-q.x,y:hit.y*p.H-q.y}}
    else{if(st.sel)setSel(st.sel.p,null);snap(p);mode='draw';last=q;stroke(p,q,q)}
    refresh();
  });
  fx.addEventListener('pointermove',e=>{
    if(!mode)return;const q=pos(e);
    if(mode==='draw'){stroke(p,last,q);last=q}
    else{const it=st.sel.it;if(!snapped){snap(p);snapped=true}it.x=Math.min(.97,Math.max(.03,(q.x+off.x)/p.W));it.y=Math.min(.97,Math.max(.03,(q.y+off.y)/p.H));renderFx(p)}
  });
  const end=()=>{if(mode)refresh();mode=null};
  fx.addEventListener('pointerup',end);fx.addEventListener('pointercancel',end);
}
function stroke(p,a,b){
  const x=p.dctx;x.lineCap=x.lineJoin='round';x.lineWidth=st.size*S/400;x.strokeStyle=st.tool==='eraser'?'#fff':st.color;
  x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x+.01,b.y);x.stroke();
}
function addItem(o){
  const p=P();snap(p);const n=p.items.length;
  const it={id:newId('i'),x:.5,y:Math.min(.8,.28+(n%4)*.15),s:1,r:0,pop:reduce?1:.2,...o};
  p.items.push(it);setSel(p,it);
  if(!reduce){const t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/400),c1=1.70158,c3=c1+1;it.pop=k>=1?1:1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);renderFx(p);if(k<1)requestAnimationFrame(f)})(t0)}
}
function selDo(fn){const s=st.sel;if(!s)return;snap(s.p);fn(s.it,s.p);renderFx(s.p);refresh()}

/* compose the whole page into one picture */
function compose(){
  const L=st.lay,c=L.cols,G=20,FH=76,rows=[];
  for(let i=0;i<st.panels.length;i+=c)rows.push(st.panels.slice(i,i+c));
  const rh=rows.map(r=>Math.max(...r.map(p=>p.H))),W=c*S+(c+1)*G,H=rh.reduce((a,b)=>a+b,0)+(rows.length+1)*G+FH;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d',{willReadFrequently:true});x.fillStyle='#0F101A';x.fillRect(0,0,W,H);
  let y=G;
  rows.forEach((r,ri)=>{r.forEach((p,ci)=>{const ox=G+ci*(S+G);
    x.drawImage(p.dr,ox,y);stylize(x,ox,y,p.W,p.H,st.style);
    x.save();x.translate(ox,y);x.beginPath();x.rect(0,0,p.W,p.H);x.clip();p.items.forEach(it=>drawItem(x,it,p.W,p.H,false,true));x.restore()});y+=rh[ri]+G});
  x.textBaseline='middle';x.textAlign='left';x.fillStyle='#F4F5FB';x.font=`800 30px ${FF}`;x.fillText(($('#title').value.trim()||t('untitled')).slice(0,40),G,H-FH/2+2);
  x.textAlign='right';x.fillStyle='#FDCB6E';x.font='40px Bangers,Impact,sans-serif';x.fillText('ComicCraft',W-G,H-FH/2+2);
  return cv;
}
function thumb(w){const cv=compose(),tc=document.createElement('canvas');w=Math.min(w,cv.width);tc.width=w;tc.height=Math.round(cv.height*w/cv.width);tc.getContext('2d').drawImage(cv,0,0,tc.width,tc.height);return tc.toDataURL('image/jpeg',.72)}
const slug=s=>(s||'my-comic').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'my-comic';
$('#download').onclick=()=>{compose().toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=slug($('#title').value)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('toast_dl'))},'image/png')};

/* motion comic video (WebM) */
$('#motionExp').onclick=()=>{
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast(t('toast_nomotion'));return}
  const base=compose(),w=Math.min(base.width,900)&~1,h=Math.round(base.height*w/base.width)&~1,cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d'),mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  let rec;try{rec=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt}:{})}catch(e){toast(t('toast_nomotion'));return}
  const chunks=[],mode=st.motion||1;rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{const b=new Blob(chunks,{type:rec.mimeType||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=slug($('#title').value)+(b.type.includes('mp4')?'.mp4':'.webm');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),6000);toast(t('toast_dl'))};
  toast(t('toast_rec'));rec.start();const t0=performance.now(),D=4500;
  (function f(now){const k=Math.min(1,(now-t0)/D);
    let z=1,dx=0,dy=0;if(mode===1){z=1+.14*k;dx=-.025*w*k;dy=-.02*h*k}else if(mode===2){z=1.03;dx=Math.sin(k*90)*.01*w;dy=Math.cos(k*70)*.01*h}else{z=1+.045*Math.sin(k*Math.PI*2)}
    x.fillStyle='#0F101A';x.fillRect(0,0,w,h);x.save();x.translate(w/2+dx,h/2+dy);x.scale(z,z);x.drawImage(base,-w/2,-h/2,w,h);x.restore();
    if(k<1)requestAnimationFrame(f);else rec.stop()})(t0);
};

}
function paintProfile(){
  const p=prof(),m=me(),projects=LS.get('cc_projects',[]),bm=bmAll(),posts=FEED.filter(x=>x.authorId===m.id),likes=LS.get('cc_likes',[]).length,pubs=UCOMICS.filter(x=>x.authorId===m.id);
  const empty=(e,k,cta)=>`<div class="empty"><div class="big">${e}</div><p>${t(k)}</p>${cta?`<p style="margin-top:14px"><a class="btn pri" href="#studio">🎨 ${t('cta_draw')}</a></p>`:''}</div>`;
  let list='';
  if(ptab==='mine')list=projects.length?projects.map((r,i)=>`<div class="cc" style="--c:${COLS[i%3]};cursor:default"><div class="cv" style="aspect-ratio:auto"><img alt="" src="${r.thumb}"></div><div class="in"><h3>${esc(r.title)}</h3><div class="sh-act"><button class="btn sm cy" data-o="${r.id}">${t('open')}</button><button class="btn sm ghost" data-d="${r.id}">🗑️ ${t('del')}</button></div></div></div>`).join(''):empty('🗂️','shelf_empty',true);
  else if(ptab==='pub')list=pubs.length?pubs.map((d,i)=>{const c=normUser(d);return `<div class="cc" data-id="${esc(c.id)}" style="--c:${c.c};cursor:pointer"><div class="cv"><img alt="" src="${esc(c.coverUrl||'')}"><span class="tag">${esc(c.genre)}</span></div><div class="in"><h3>${esc(c.title)}</h3><div class="meta"><span>${c.pageCount||1} ${t('pages')}</span><span>❤ ${c.likes} · 👁 ${c.views}</span></div><div class="sh-act"><button class="btn sm ghost" data-dpub="${esc(c.id)}">🗑️ ${t('del')}</button></div></div></div>`}).join(''):empty('📖','pub_empty',true);
  else if(ptab==='bm'){const it=Object.entries(bm).filter(([id])=>findComic(id));list=it.length?it.map(([id,v])=>card(findComic(id),v.p)).join(''):empty('🔖','bm_empty')}
  else list=posts.length?posts.map(x=>`<div class="cc" style="--c:var(--pink);cursor:default"><div class="cv" style="aspect-ratio:auto"><img alt="" src="${esc(x.imageUrl)}"></div><div class="in"><h3>${esc(x.title)}</h3><div class="sh-act"><button class="btn sm ghost" data-dp="${esc(x.id)}">🗑️ ${t('del')}</button></div></div></div>`).join(''):empty('🌟','posts_empty');
  $('#profileBody').innerHTML=`<h2>${t('prof_h')}</h2>
  <div class="pf"><div class="big">${esc(m.avatar)}</div><div class="fld"><input class="field" id="pName" maxlength="24" value="${esc(p.name)}" placeholder="${t('name_ph')}" aria-label="${t('name_ph')}"><div class="rowf" style="margin-top:10px" id="pAv">${AVATARS.map(a=>`<button class="chip${a===p.avatar?' on':''}" data-a="${a}" aria-label="${a}">${a}</button>`).join('')}</div></div></div>
  <p class="note">${t('safe_tip')}</p>
  <div class="stats"><div><b>${projects.length}</b>${t('st_comics')}</div><div><b>${pubs.length}</b>${t('pt_pub')}</div><div><b>${posts.length}</b>${t('st_posts')}</div><div><b>${likes}</b>${t('st_likes')}</div></div>
  <div class="seg" id="pSeg">${[['mine','pt_mine'],['pub','pt_pub'],['bm','pt_bm'],['posts','pt_posts']].map(([k,l])=>`<button class="chip${ptab===k?' on':''}" data-k="${k}">${t(l)}</button>`).join('')}</div>
  <div class="shelf" id="pList">${list}</div>
  <div class="note" style="margin-top:34px">${DB.mode==='firebase'?(DB.user?`${t('acct_in')} <b>${esc(DB.user.displayName||'')}</b>`:t('acct_out')):t('acct_local')}
  <div class="rowf" style="margin-top:10px">${DB.mode==='firebase'?(DB.user?`<button class="btn sm ghost" id="so">${t('sign_out')}</button>`:`<button class="btn sm" id="si">${t('sign_in')}</button>`):''}<button class="btn sm ghost" id="wipe">🧹 ${t('wipe')}</button></div></div>`;
  $('#pName').onchange=e=>{const q=prof();q.name=e.target.value.trim();LS.set('cc_profile',q);paintProfile()};
  $$('#pAv .chip').forEach(b=>b.onclick=()=>{const q=prof();q.avatar=b.dataset.a;LS.set('cc_profile',q);paintProfile()});
  $$('#pSeg .chip').forEach(b=>b.onclick=()=>{ptab=b.dataset.k;paintProfile()});
  bindCards($('#pList'));
  $$('[data-o]',$('#pList')).forEach(b=>b.onclick=()=>openProject(b.dataset.o));
  $$('[data-d]',$('#pList')).forEach(b=>b.onclick=()=>deleteProject(b.dataset.d,paintProfile));
  $$('[data-dp]',$('#pList')).forEach(b=>b.onclick=async()=>{if(await ask({title:t('q_del'),confirm:true})){await DB.del('feed',b.dataset.dp)}});
  $$('[data-dpub]',$('#pList')).forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await ask({title:t('q_del'),confirm:true})){await DB.del('comics',b.dataset.dpub)}});
  const si=$('#si');if(si)si.onclick=()=>DB.signIn().catch(()=>toast(t('toast_post_fail')));
  const so=$('#so');if(so)so.onclick=()=>DB.signOut();
  $('#wipe').onclick=async()=>{if(await ask({title:t('q_wipe'),confirm:true})){Object.keys(localStorage).filter(k=>k.indexOf('cc_')===0).forEach(k=>localStorage.removeItem(k));location.hash='#home';location.reload()}};
}

/* ===== main ===== */
const NAV=[['home','🏠','nav_home'],['studio','🎨','nav_studio'],['community','🌟','nav_community'],['collab','👥','nav_collab'],['profile','👤','nav_profile']];
let route='home';
function buildNav(){
  [$('#navT'),$('#navB')].forEach((n,i)=>{n.innerHTML=NAV.map(([k,e,l])=>`<a href="#${k}" data-k="${k}">${i?`<b>${e}</b>`:''}<span>${t(l)}</span></a>`).join('')});markNav();
}
function markNav(){const k=route==='read'?'home':route;$$('.nav a').forEach(a=>{if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
function renderRoute(){
  const [v0,arg]=(location.hash.slice(1)||'home').split('/');
  let v=['home','studio','community','collab','profile','read'].includes(v0)?v0:'home';
  if(v==='read'&&!arg)v='home';
  route=v;
  $$('.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  $('#prog').hidden=v!=='read';markNav();
  if(v==='home')renderHome();
  else if(v==='read')renderReader(arg);
  else if(v==='studio')studioPane();
  else if(v==='community')renderFeed();
  else if(v==='collab')renderCollab(arg);
  else if(v==='profile')renderProfile();
}
function go(){renderRoute();window.scrollTo(0,0)}
function onAuthChange(){renderRoute()}
addEventListener('hashchange',go);

function renderAll(){applyLang();buildNav();$$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));renderRoute();redrawAll()}
$('#langB').onclick=()=>{lang=lang==='en'?'bn':'en';LS.set('cc_lang',lang);renderAll()};
$('#themeB').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* start */
setTheme(LS.get('cc_theme',matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));
applyLang();buildNav();
startShared();probeAI();
$('#bgs').innerHTML=$('#bgs').innerHTML;
renderRoute();
if(document.fonts){['400 20px Bangers','800 20px "Baloo 2"','800 20px "Baloo Da 2"'].forEach(f=>document.fonts.load(f,'Aঅ').then(redrawAll).catch(()=>{}));document.fonts.ready.then(redrawAll)}
if(window.COMICCRAFT_FIREBASE&&window.COMICCRAFT_FIREBASE.apiKey)enableFirebase(window.COMICCRAFT_FIREBASE).catch(e=>console.warn('Firebase not enabled:',e));
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});

})();
</script>
</body>
